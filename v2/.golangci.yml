version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  exclusions:
    generated: lax
    rules:
      # Test helpers deliberately spin up a fake adb on disk and read back
      # recorded args; the gosec file-permission and file-inclusion checks are
      # not meaningful there.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
